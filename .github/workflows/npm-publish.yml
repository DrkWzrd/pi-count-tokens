# Publishes the package to npm when a GitHub release is published.
# Save as .github/workflows/publish.yml
# Requires an npm access token stored as the repository secret NPM_TOKEN.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # needed for npm provenance

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # Fails early if the release tag (e.g. v1.0.1) doesn't match package.json's version.
      - name: Check tag matches package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
